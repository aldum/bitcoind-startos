name: Build Service

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["*.md"]
    branches: ["master", "update/036", "036/feature/ci"]
  push:
    paths-ignore: ["*.md"]
    branches: ["master", "update/036", "036/feature/ci"]

jobs:
  BuildPackage:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare StartOS SDK
        uses: aldum/start-sdk-action@v1.3.6

      - name: Checkout services repository
        uses: actions/checkout@v4
        with:
          ref: update/036
          submodules: recursive

      - name: Build the service package
        id: build
        run: |
          git submodule update --init --recursive
          start-cli init
          npm i
          npm run build
          make
        shell: bash

      - name: Setting package ID and title from the manifest
        id: package
        run: |
          echo "package_id=$(sed -n -r -e "s/\s*id\s*: '(.+)',/\1/ p" startos/manifest.ts) >> $GITHUB_ENV
          echo "package_title=$(sed -n -r -e "s/\s*title\s*: '(.+)',/\1/ p" startos/manifest.ts)" >> $GITHUB_ENV
        shell: bash

      - name: Upload .s9pk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package_id }}.s9pk
          path: ./${{ env.package_id }}.s9pk
